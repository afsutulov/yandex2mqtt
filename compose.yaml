services:
  yandex2mqtt:
    build: .
    restart: unless-stopped
    user: "${Y2M_UID:-1000}:${Y2M_GID:-1000}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
